- name: Ensure gitea data directory exists
  ansible.builtin.file:
    path: /opt/caddy/gitea
    state: directory
    mode: "0755"

- name: Ensure gitea compose directory exists
  ansible.builtin.file:
    path: /home/SSH_USER/gitea
    state: directory
    mode: "0755"
    owner: SSH_USER
    group: SSH_USER

- name: Write docker-compose.yml
  ansible.builtin.copy:
    dest: /home/SSH_USER/gitea/docker-compose.yml
    owner: SSH_USER
    group: SSH_USER
    mode: "0644"
    content: |
      networks:
        gitea:
          external: false
        oryks:
          external: true

      services:
        server:
          image: docker.gitea.com/gitea:1.26.2
          container_name: gitea
          restart: always
          environment:
            USER_UID: "1000"
            USER_GID: "1000"
            GITEA__database__DB_TYPE: postgres
            GITEA__database__HOST: db:5432
            GITEA__database__NAME: gitea
            GITEA__database__USER: gitea
            GITEA__database__PASSWD: "{{ gitea_db_password }}"
            GITEA__server__ROOT_URL: "{{ gitea_root_url }}"
          networks:
            - gitea
            - oryks
          volumes:
            - ./gitea:/data
          ports:
            - "3000:3000"
            - "222:22"
          depends_on:
            - db

        db:
          image: postgres:14
          container_name: gitea-db
          restart: always
          environment:
            POSTGRES_USER: gitea
            POSTGRES_PASSWORD: "{{ gitea_db_password }}"
            POSTGRES_DB: gitea
          networks:
            - gitea
          volumes:
            - ./postgres:/var/lib/postgresql/data

  vars:
    gitea_db_password: "replace-with-real-secret"
    gitea_root_url: "https://git.oryks.org/"