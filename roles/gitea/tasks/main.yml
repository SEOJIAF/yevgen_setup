- name: Ensure Gitea project directory exists
  become: true
  ansible.builtin.file:
    path: /home/SSH_USER/gitea
    state: directory
    owner: SSH_USER
    mode: "0755"

- name: Check for existing Gitea compose file
  become: true
  ansible.builtin.stat:
    path: /home/SSH_USER/gitea/docker-compose.yml
  register: gitea_compose

- name: Remove old Gitea data directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/SSH_USER/gitea/postgres
    - /home/SSH_USER/gitea/gitea
  when: not gitea_compose.stat.exists

- name: Recreate Gitea data directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - { path: "/home/SSH_USER/gitea/postgres", owner: "1000", group: "1000" }
    - { path: "/home/SSH_USER/gitea/gitea", owner: "1000", group: "1000" }
  when: not gitea_compose.stat.exists

- name: Write Gitea compose file
  become: true
  ansible.builtin.copy:
    dest: /home/SSH_USER/gitea/docker-compose.yml
    owner: SSH_USER
    mode: "0644"
    content: |
      networks:
        gitea:
          external: false
        oryks:
          external: true

      services:
        server:
          image: docker.gitea.com/gitea:1.26.2
          container_name: gitea
          restart: always
          environment:
            USER_UID: "1000"
            USER_GID: "1000"
            GITEA__database__DB_TYPE: postgres
            GITEA__database__HOST: db:5432
            GITEA__database__NAME: gitea
            GITEA__database__USER: gitea
            GITEA__database__PASSWD: "{{ lookup('password', 'credentials/gitea_db_password chars=ascii_letters,digits length=32') }}"
            GITEA__server__ROOT_URL: "https://git.oryks.org/"
            GITEA__service__DISABLE_REGISTRATION: "true"
          networks:
            - gitea
            - oryks
          volumes:
            - ./gitea:/data
          ports:
            - "3000:3000"
            - "222:22"
          depends_on:
            - db

        db:
          image: postgres:14
          container_name: gitea-db
          restart: always
          environment:
            POSTGRES_USER: gitea
            POSTGRES_PASSWORD: "{{ lookup('password', 'credentials/gitea_db_password chars=ascii_letters,digits length=32') }}"
            POSTGRES_DB: gitea
          networks:
            - gitea
          volumes:
            - ./postgres:/var/lib/postgresql/data

- name: Pull Gitea image
  become: true
  community.docker.docker_image:
    name: docker.gitea.com/gitea:1.26.2
    source: pull
    force_source: true

- name: Pull Postgres image
  become: true
  community.docker.docker_image:
    name: postgres:14
    source: pull
    force_source: true

- name: Start Gitea stack
  become: true
  community.docker.docker_compose_v2:
    project_src: /home/SSH_USER/gitea
    state: present
    remove_orphans: true
    wait: true
    wait_timeout: 120