---
- name: Ensure gitea data directory exists
  ansible.builtin.file:
    path: /opt/caddy/gitea
    state: directory
    mode: "0755"

- name: Pull gitea image
  community.docker.docker_image:
    name: docker.gitea.com/gitea:1.26.2
    source: pull
    force_source: true

- name: Ensure gitea compose directory exists
  ansible.builtin.file:
    path: /home/SSH_USER/gitea
    state: directory
    mode: "0755"
    owner: SSH_USER
    group: sudo

- name: Write docker-compose.yml
  ansible.builtin.copy:
    dest: /home/SSH_USER/gitea/docker-compose.yml
    owner: SSH_USER
    group: SSH_USER
    mode: "0644"
    content: |
      networks:
        gitea:
          external: false
        oryks
          external: false

      services:
        server:
          image: docker.gitea.com/gitea:1.26.2
          container_name: gitea
          environment:
            - USER_UID=1000
            - USER_GID=1000
            - GITEA__database__DB_TYPE=postgres
            - GITEA__database__HOST=db:5432
            - GITEA__database__NAME=gitea
            - GITEA__database__USER=gitea
            - GITEA__database__PASSWD={{ lookup('env', 'GITEA_DB_PASSWORD') }}
            - GITEA__server__ROOT_URL={{ lookup('env', 'GITEA_ROOT_URL') }}
          restart: always
          networks:
            - gitea
            - oryks
          volumes:
            - ./gitea:/data
          ports:
            - "3000:3000"
            - "222:22"
          depends_on:
            - db

        db:
          image: postgres:14
          restart: always
          environment:
            - POSTGRES_USER=gitea
            - POSTGRES_PASSWORD={{ lookup('env', 'GITEA_DB_PASSWORD') }}
            - POSTGRES_DB=gitea
          networks:
            - gitea
          volumes:
            - ./postgres:/var/lib/postgresql/data

- name: Start gitea stack
  community.docker.docker_compose_v2:
    project_src: /home/SSH_USER/gitea
    state: present