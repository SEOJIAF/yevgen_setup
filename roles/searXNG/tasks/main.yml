- name: Ensure SearXNG config directory exists
  ansible.builtin.file:
    path: /opt/searxng/config
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy searxng settings.yml (limiter disabled)
  ansible.builtin.copy:
    dest: /opt/searxng/config/settings.yml
    owner: root
    group: root
    mode: "0644"
    content: |
      use_default_settings: true
      server:
        base_url: "https://search.oryks.org/"
        secret_key: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=32') }}"
        limiter: false
      search:
        formats:
          - html
          - json

- name: Pull searXNG image
  community.docker.docker_image:
    name: searxng/searxng:latest
    source: pull
    force_source: true

- name: Start searxng container
  community.docker.docker_container:
    name: searxng
    image: searxng/searxng:latest
    state: started
    restart_policy: unless-stopped
    networks:
      - name: oryks
    volumes:
      - /opt/searxng/config:/etc/searxng
      - /opt/searxng/data:/var/cache/searxng
    env:
      SEARXNG_BASE_URL: "https://search.oryks.org/"