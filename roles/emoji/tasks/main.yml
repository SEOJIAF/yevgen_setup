---
  - name: Write emoji users.yml
    ansible.builtin.copy:
      dest: /home/dawg/emoji.sh
      content: |
        #!/bin/sh
        set -u

        tmpfile=$(mktemp) || { echo "Error: could not create temp file" >&2; exit 1; }
        trap 'rm -f "$tmpfile"' EXIT HUP INT TERM QUIT

        # Fetch the homepage (all art is server-rendered in the HTML)
        http_code=$(curl -s -o "$tmpfile" -w '%{http_code}' \
        --connect-timeout 15 --max-time 60 \
        'https://asciilol.art/') || {
        echo "Error: curl failed (network error)" >&2
        exit 1
        }

        if [ "$http_code" != "200" ]; then
        echo "Error: HTTP status $http_code (expected 200)" >&2
        exit 1
        fi

        # Count ASCII art pieces on the page
        count=$(grep -c '<div data-type="dot_art" class="emojis"' "$tmpfile")

        if [ "$count" -eq 0 ]; then
        echo "Error: no ASCII art found on page" >&2
        exit 1
        fi

        # Pick a random index (awk's rand/srand for POSIX portability)
        n=$(awk -v count="$count" 'BEGIN { srand(); print int(rand() * count) + 1 }')

        # Extract the n-th ASCII art piece
        awk -v RS='<div data-type="dot_art" class="emojis"' -v n="$n" '
        NR == n + 1 {
        # Find the > that closes the opening tag
        idx = index($0, ">")
        if (idx > 0) {
            content = substr($0, idx + 1)
            # Find the closing </div>
            close_idx = index(content, "</div>")
            if (close_idx > 0) {
            print substr(content, 1, close_idx - 1)
            }
        }
        }
        ' "$tmpfile"
      mode: '0644'