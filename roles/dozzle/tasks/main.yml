---
  - name: Ensure Docker network oryks exists
    community.docker.docker_network:
      name: oryks
      state: present

  - name: Ensure Dozzle data directory exists
    file:
      path: /opt/dozzle/data
      state: directory
      mode: '0755'

  - name: Install htpasswd for bcrypt password hashing
    ansible.builtin.apt:
      name: apache2-utils
      state: present
      update_cache: true

  - name: Pull Dozzle image
    community.docker.docker_image:
      name: amir20/dozzle:latest
      source: pull
      force_source: true

  - name: Generate bcrypt password hash
    ansible.builtin.shell: |
      htpasswd -nbB "{{ lookup('env', 'DOZZLE_USERNAME') }}" "{{ lookup('env', 'DOZZLE_PASSWORD') }}" | cut -d: -f2
    register: dozzle_pw_hash
    changed_when: false
    no_log: true

  - name: Write Dozzle users.yml
    ansible.builtin.copy:
      dest: /opt/dozzle/data/users.yml
      content: |
        users:
          {{ lookup('env', 'DOZZLE_USERNAME') }}:
            name: {{ lookup('env', 'DOZZLE_USERNAME') }}
            email: {{ lookup('env', 'DOZZLE_EMAIL') }}
            password: "{{ dozzle_pw_hash.stdout }}"
      mode: '0644'


  - name: Start Dozzle container with authentication
    community.docker.docker_container:
      name: dozzle
      image: amir20/dozzle:latest
      state: started
      restart_policy: unless-stopped
      networks:
        - name: oryks
      ports:
        - "8080:8080"
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - /opt/dozzle/data:/data
      env:
        DOZZLE_AUTH_PROVIDER: simple